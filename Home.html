<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Riddles</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>
   <!-- Welcome Overlay -->
    
   <div id="welcome-overlay" class="overlay">
    <div class="welcome-modal">
        <h2>Welcome!</h2>
        <p>Enter your name and press Enter to continue</p>
        <input type="text" id="name-input" placeholder="Your name..." autocomplete="off" />
    </div>
</div>

<!-- ////////////// -->

 <div id="side-bar">
    <img id="BookIcon" src="icons8-books-100.png" alt="Book Icon">
     <div id="sidebar-items">
        <img id="reading" src="icons8-book-64.png" alt="Reading Icon">
        <img id="listen" src="icons8-headphones-64.png" alt="Listen Icon">
        <img id="saved" src="icons8-save-48.png" alt="Saved Icon">
        <img id="LeaderBoard" src="icons8-leaderboard-48.png" alt="Leaderboard Icon">
        <img id="bell" src="icons8-bell-48.png" alt="Bell Icon">
      </div>
      <img id="profile" src="icons8-profile-64.png" alt="Profile Icon">
 </div>



<div id="center">

    <div class="header">
        
    <div class="search">
         <svg class="search-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
             <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2" />
             <path d="m16 16 4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
         </svg>
         <input type="text" placeholder="Search">
    </div>
    <h1 class="date"></h1>
    </div>

  <h1 id="center_text">Good afternoon!</h1><br>
  <h1 class="name"></h1>
     
</div>


</body>
<script src="main.js"></script>
</html>
